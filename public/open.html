<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B7CF6" />
  <meta name="robots" content="noindex" />
  <title>Opening Horae…</title>
  <style>
    :root { --brand: #8B7CF6; --ink: #162D4E; --ink-soft: #64748b; --bg: #FBFAFF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #EEE9FF 0%, var(--bg) 45%, #EAF2FF 100%);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      width: 100%; max-width: 360px; background: #fff;
      border: 1px solid #eef0f6; border-radius: 24px;
      padding: 32px 24px; box-shadow: 0 12px 40px rgba(22,45,78,.10);
    }
    .logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin: 0 auto 18px; display: block; }
    h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
    p { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin: 0 0 20px; }
    .btn {
      display: block; width: 100%; border: 0; cursor: pointer;
      background: var(--brand); color: #fff; font-size: 15px; font-weight: 600;
      padding: 14px 18px; border-radius: 14px; text-decoration: none;
      box-shadow: 0 6px 18px rgba(139,124,246,.35); transition: transform .06s ease, opacity .2s;
    }
    .btn:active { transform: scale(.98); }
    .link { display: inline-block; margin-top: 16px; font-size: 12px; color: var(--ink-soft); text-decoration: underline; }
    .hint { margin-top: 18px; font-size: 11.5px; line-height: 1.5; color: #94a3b8; }
    .spinner {
      width: 22px; height: 22px; margin: 0 auto 16px; border-radius: 50%;
      border: 3px solid #e6e2f7; border-top-color: var(--brand); animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/app-icon-192.png" alt="Horae" onerror="this.style.display='none'" />

    <!-- Redirecting state (standalone PWA / desktop) -->
    <div id="loading">
      <div class="spinner"></div>
      <h1>Opening Horae…</h1>
      <p>Taking you to the app.</p>
    </div>

    <!-- Manual card (in-app browser on phones) -->
    <div id="manual" hidden>
      <h1>Open Horae</h1>
      <p id="manual-copy">Tap below to open Horae in your browser or installed app.</p>
      <a id="open-btn" class="btn" href="#">Open Horae App</a>
      <p class="hint" id="ios-hint" hidden>
        On iPhone: if this stays inside WhatsApp, tap the
        <strong>⋯</strong> (or share) icon and choose <strong>Open in Safari</strong>.
      </p>
      <a id="continue" class="link" href="#">Continue in this browser</a>
    </div>
  </div>

  <script>
    (function () {
      // ── Resolve destination from ?to= (default: dashboard). Only same-origin
      //    app paths are allowed — never an absolute/external URL (open-redirect
      //    guard). URLSearchParams has already percent-decoded the value.
      var params = new URLSearchParams(location.search);
      var to = params.get('to') || '/dashboard';
      if (typeof to !== 'string' || to.charAt(0) !== '/' || to.charAt(1) === '/') to = '/dashboard';
      to = to.replace(/#.*$/, '');      // strip any fragment so it can't break the intent
      to = to.replace(/[.,!?;:]+$/, ''); // drop trailing sentence punctuation that can trail a link in chat text

      var origin = location.protocol + '//' + location.host;
      var destination = origin + to;

      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iphone|ipad|ipod/i.test(ua);
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;

      // Android "intent://" launch, targeted at Chrome specifically
      // (package=com.android.chrome). A PWA installed via Chrome is a
      // Chrome-owned WebAPK, so only Chrome can open it as the standalone app —
      // handing the link to the phone's *default* browser (e.g. Samsung
      // Internet) just opens a tab it can't promote to the app. If Chrome isn't
      // installed, browser_fallback_url loads the page in the current browser.
      var intentUrl = 'intent://' + location.host + to
        + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='
        + encodeURIComponent(destination) + ';end';

      // Already running inside the installed PWA (or standalone) — just go there.
      if (isStandalone) { location.replace(destination); return; }

      function showManual() {
        document.getElementById('loading').hidden = true;
        var manual = document.getElementById('manual');
        manual.hidden = false;

        var openBtn = document.getElementById('open-btn');
        var continueLink = document.getElementById('continue');
        continueLink.setAttribute('href', destination);

        if (isAndroid) {
          openBtn.setAttribute('href', intentUrl);
          document.getElementById('manual-copy').textContent =
            'Tap to open Horae in the app (via Chrome).';
        } else if (isIOS) {
          openBtn.setAttribute('href', destination);
          document.getElementById('ios-hint').hidden = false;
          document.getElementById('manual-copy').textContent =
            'Open Horae for the full app experience.';
        } else {
          openBtn.setAttribute('href', destination);
        }
      }

      if (isAndroid || isIOS) {
        // On phones the tap arrives inside WhatsApp's in-app browser. We show a
        // button rather than auto-redirecting: WebViews routinely block a
        // gesture-less scheme navigation, and a failed auto-jump can strand the
        // user on a browser error page. A single explicit tap is reliable —
        // Android fires the intent (escapes to Chrome / opens the PWA), iOS
        // opens the destination with guidance to leave the in-app browser.
        showManual();
      } else {
        // Desktop / other: nothing to escape, just continue to the app.
        location.replace(destination);
      }
    })();
  </script>
</body>
</html>
